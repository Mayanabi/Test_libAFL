# ─── one_shot.toml — paquet unique à envoyer à la main ───────────────────────
#
# Usage : cargo run --bin send_packet
#         (ou cargo run --bin send_packet -- chemin/vers/autre_spec.toml)
#
# Envoie CE paquet une seule fois, directement à NOS3, hors séquence et hors
# boucle LibAFL — pratique pour tester un paquet fait main (faux flags, valeur
# précise sur un champ) sans attendre le fuzzing automatique.
#
# Structure alignée sur le paquet CCSDS réel :
#   [header]            → header primaire (48 bits : ID + SEQ)
#   [secondary_header]  → Function Code + Checksum
#   [[payload]]         → user data field (paramètres applicatifs du TC)

# Template de départ, cherché dans catalogue_dump.json : fournit le port, le
# target ("CFS") et la liste des args par défaut (avec leurs valeurs nominales).
tc_name = "CFE_ES_RESTART_CC"

# Délais optionnels avant l'envoi (par défaut : 0).
# delay_min_ms = 0
# delay_max_ms = 0

# ─── [header] — header primaire CCSDS, sous-champ par sous-champ ────────────
#
# Seul moyen de toucher ID/SEQ — même niveau de contrôle que les mutateurs
# 7-12 (VersionMutator, ApidMutator, SeqFlagsMutator, ...), sans calculer le
# mot 16 bits à la main. Tous les champs sont optionnels — seuls ceux présents
# ici sont modifiés, le reste vient du template tc_name.

[header]
version      = 1          # 3 bits (0-7)          — nominal = 0
packet_type  = 1         # 1 bit  (0=TM, 1=TC)   — nominal = 1
sec_hdr_flag = 1          # 1 bit — 0 = pas de secondary header, 1 = présent
apid         = 0x1870    # 11 bits — adresse de routage cFS
seq_flags    = 3         # 2 bits (0-3)          — nominal = 3 (0b11, complet)
seq_count    = 0         # 14 bits

# ─── [secondary_header] — Function Code + Checksum ───────────────────────────
#
# N'a de sens que si header.sec_hdr_flag = 1 ci-dessus.

[secondary_header]
#fc = "0xFF"
# checksum = "0x00"

# ─── [[payload]] — user data field (paramètres applicatifs du TC) ───────────
#
# `name` = le nom de l'arg tel qu'il apparaît dans catalogue_dump.json pour ce
# TC (un paramètre spécifique à la commande — PAS ID/SEQ/LEN/FC/CHECKSUM, qui
# ont leurs sections dédiées ci-dessus). `value` est envoyée telle quelle
# (ex: "0xFF", "1234", "toto").
#
[[payload]]
name  = "RESTARTTYPE"
value = "1"
