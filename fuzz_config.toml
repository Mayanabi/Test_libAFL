# ─── fuzz_config.toml — Configuration de campagne Maya LibAFL ────────────────
#
# Modifie ce fichier avant de lancer `cargo run` — pas besoin de recompiler.
#
# ─── MODE ─────────────────────────────────────────────────────────────────────
#
#   single_app  → une seule app ciblée        (apps = ["ES"])
#   multi_app   → plusieurs apps ciblées      (apps = ["ES", "CF", "EVS"])
#   all         → toutes les apps sans liste  (apps ignoré, ~315 TC)
#   cross_app   → séquences multi-apps        (mix aléatoire d'apps différentes)
#   naive       → flood sans feedback         (~110 pkt/sec, naive_batch_size paquets/exec)
#   stateful    → guidé par machine d'états   (FSM YAMLs dans fsm_dir)
#
mode = "all"

# ─── APPS CIBLÉES ─────────────────────────────────────────────────────────────
# Utilisé pour single_app et multi_app uniquement.
# Pour les autres modes, ce champ est ignoré.
#
# cFE core   : ES, EVS, SB, TBL, TIME
# cFS apps   : CF, CI, CS, DS, FM, HK, HS, LC, MD, MM, SC, SCH, SBN, TO, TO_LAB
# Composants : ARDUCAM, GENERIC_ADCS, GENERIC_CSS, GENERIC_EPS, GENERIC_FSS,
#              GENERIC_IMU, GENERIC_MAG, GENERIC_RADIO, GENERIC_REACTION_WHEEL,
#              GENERIC_STAR_TRACKER, GENERIC_THRUSTER, GENERIC_TORQUER,
#              MGR, NOVATEL_OEM615, SAMPLE, SYN
#
apps = ["NOVATEL_OEM615"]

# ─── FILTRE PAR PRIORITÉ ──────────────────────────────────────────────────────
# Optionnel — commenter pour fuzzer toutes les priorités.
# Valeurs : "CRITICAL" | "HIGH" | "MEDIUM" | "NORMAL"
#
# fuzz_priority = "CRITICAL"

# ─── SEEDS INITIALES ──────────────────────────────────────────────────────────
seed_count = 8

# ─── PARAMÈTRES CROSS-APP ─────────────────────────────────────────────────────
# Actifs uniquement si mode = "cross_app".
#
cross_app_min_tc = 2
cross_app_max_tc = 5

# ─── PARAMÈTRES NAIVE ─────────────────────────────────────────────────────────
# Actif uniquement si mode = "naive".
# Nombre de paquets envoyés par subprocess (sans attendre le feedback NOS3).
# 10 paquets × ~11 exec/sec ≈ 110 paquets/sec.
#
naive_batch_size = 10

# ─── PARAMÈTRES STATEFUL ──────────────────────────────────────────────────────
# Actif uniquement si mode = "stateful".
# Répertoire contenant les FSM YAMLs générés pour chaque app NOS3.
#
fsm_dir = "/home/jstar/Desktop/maya3/patterns/stateful"

# ─── MUTATEURS ──────────────────────────────────────────────────────────────
# Optionnel — commenter (ou supprimer) pour utiliser tous les mutateurs
# disponibles (tirage aléatoire parmi tous, à chaque paquet muté).
#
# Une seule entrée  → ce mutateur est utilisé pour TOUS les paquets mutés.
# Plusieurs entrées → un mutateur est tiré au hasard dans cette liste,
#                      séparément pour chaque paquet muté.
#
# Valeurs possibles :
#   arg_value       → havoc byte-level (bit flip/byte random/insert/delete/copy)
#   fc_walk         → marche aléatoire autour du Function Code (args[3])
#   int_boundary    → valeurs frontières pour les args UINT/INT
#   string_special  → chaînes spéciales (format string, path traversal, ...) pour STRING
#   command_reorder → échange l'ordre de deux commandes de la séquence
#   delay           → fait varier delay_min_ms / delay_max_ms
#   version         → champ Version du primary header CCSDS (3 bits)
#   packet_type     → champ Type du primary header CCSDS (TC/TM, 1 bit)
#   sec_hdr_flag    → champ Secondary Header Flag du primary header CCSDS (1 bit)
#   apid            → champ APID du primary header CCSDS (11 bits, routage cFS)
#   seq_flags       → champ Sequence Flags du primary header CCSDS (2 bits)
#   seq_count       → champ Sequence Count du primary header CCSDS (14 bits)
#
# Exemple (un seul mutateur, toujours le même) :
#   mutators = ["apid"]
#
# Exemple (plusieurs, tirage aléatoire à chaque paquet) :
#   mutators = ["arg_value", "fc_walk", "int_boundary", "apid", "seq_count"]
#
mutators = ["arg_value", "fc_walk", "int_boundary", "string_special", "command_reorder", "delay", "version", "packet_type", "sec_hdr_flag", "apid", "seq_flags", "seq_count"]
