app_name: "CF"
msgid: "0x18B3"
description: "CCSDS File Delivery Protocol (CFDP) engine — manages file uplink/downlink transactions using Class 1 or Class 2 CFDP"
stateless: false

# Corrigé le 2026-08-27 contre le vrai code compilé (v3.0.0, CCSDS-CFDP) :
# fsw/apps/cf/fsw/inc/cf_msg.h + fsw/apps/cf/fsw/src/cf_cmd.c. Voir aussi la
# section CF de nos3_commands_reference.yaml (même correction, même date) —
# ces deux fichiers doivent rester synchronisés (noms tc_name + tc_fc).
# fc 22/23 = CF_ENABLE_ENGINE_CC/CF_DISABLE_ENGINE_CC (sans arguments), pas
# WRITE_ACTIVE_TRANS/KICKSTART. fc 20/25/26 n'existent pas du tout dans ce
# build (CF_NUM_COMMANDS=24) — supprimés ci-dessous.

states:
  - CHANNEL_ACTIVE
  - CHANNEL_FROZEN
  - CHANNEL_DEQUEUE_DISABLED
  - TRANSACTION_SUSPENDED

transitions:
  - from: CHANNEL_ACTIVE
    to: CHANNEL_FROZEN
    tc_fc: 4
    tc_name: "CF_FREEZE_CC"
    mandatory: false
    fuzz: true
    notes: "Params: CHAN (uint8, channel or 255=all) + 3 spare bytes."

  - from: CHANNEL_FROZEN
    to: CHANNEL_ACTIVE
    tc_fc: 5
    tc_name: "CF_THAW_CC"
    mandatory: false
    fuzz: true
    notes: "Params: CHAN (uint8) + 3 spare bytes."

  - from: CHANNEL_ACTIVE
    to: TRANSACTION_SUSPENDED
    tc_fc: 6
    tc_name: "CF_SUSPEND_CC"
    mandatory: false
    fuzz: true
    notes: "Params: TS (uint32 transaction seq), EID (uint32 entity id), CHAN (uint8) + 3 spare bytes. Fuzz: bogus TS/EID pairs."

  - from: TRANSACTION_SUSPENDED
    to: CHANNEL_ACTIVE
    tc_fc: 7
    tc_name: "CF_RESUME_CC"
    mandatory: false
    fuzz: true
    notes: "Params: TS, EID, CHAN + 3 spare bytes."

  - from: CHANNEL_ACTIVE
    to: CHANNEL_DEQUEUE_DISABLED
    tc_fc: 17
    tc_name: "CF_DISABLE_DEQUEUE_CC"
    mandatory: false
    fuzz: true
    notes: "Param: CHAN (uint8, 0-2) + 3 spare bytes. Stops dequeue from outgoing queue."

  - from: CHANNEL_DEQUEUE_DISABLED
    to: CHANNEL_ACTIVE
    tc_fc: 16
    tc_name: "CF_ENABLE_DEQUEUE_CC"
    mandatory: false
    fuzz: true
    notes: "Param: CHAN (uint8, 0-2) + 3 spare bytes."

commands_always_valid:
  - tc_fc: 0
    tc_name: "CF_NOOP_CC"
    notes: "Standard cFS NOOP"
  - tc_fc: 1
    tc_name: "CF_RESET_CC"
    notes: "Param: VALUE (uint8, 0-4: ALL/CMD/FAULT/UP/DOWN) + 3 spare bytes"
    fuzz: true
  - tc_fc: 2
    tc_name: "CF_TX_FILE_CC"
    notes: "Single file downlink. Params: CLASS, KEEP, CHAN_NUM, PRIORITY, DEST_ID(uint32), SRCFILENAME(64B), DSTFILENAME(64B). Fuzz: path traversal, overlong strings, CLASS=255."
    fuzz: true
  - tc_fc: 3
    tc_name: "CF_PLAYBACK_DIR_CC"
    notes: "Directory downlink — same struct as CF_TX_FILE_CC (CF_PlaybackDirCmd_t is a typedef of CF_TxFileCmd_t). Params: CLASS, KEEP, CHAN_NUM, PRIORITY, DEST_ID(uint32), SRCPATH(64B), DSTPATH(64B)."
    fuzz: true
  - tc_fc: 8
    tc_name: "CF_CANCEL_CC"
    notes: "Params: TS (uint32), EID (uint32), CHAN (uint8) + 3 spare bytes. Cancel in-progress transaction."
    fuzz: true
  - tc_fc: 9
    tc_name: "CF_ABANDON_CC"
    notes: "Params: TS, EID, CHAN + 3 spare bytes. Abandon without closure."
    fuzz: true
  - tc_fc: 10
    tc_name: "CF_SET_MIB_PARAM_CC"
    notes: "Params: VALUE (uint32), KEY (uint8), CHAN_NUM (uint8) + 2 spare bytes. Fuzz: out-of-range KEY, boundary VALUE."
    fuzz: true
  - tc_fc: 11
    tc_name: "CF_GET_MIB_PARAM_CC"
    notes: "Params: KEY (uint8), CHAN_NUM (uint8)."
    fuzz: true
  - tc_fc: 15
    tc_name: "CF_WRITE_QUEUE_CC"
    notes: "Params: TYPE(uint8), CHAN(uint8), QUEUE(uint8), spare, FILENAME(64B string). Write queue to file."
    fuzz: true
  - tc_fc: 18
    tc_name: "CF_ENABLE_DIR_POLLING_CC"
    notes: "Params: CHAN(0-1), DIRECTORY(0-2) + 2 spare bytes."
    fuzz: true
  - tc_fc: 19
    tc_name: "CF_DISABLE_DIR_POLLING_CC"
    notes: "Params: CHAN(0-1), DIRECTORY(0-2) + 2 spare bytes."
    fuzz: true
  - tc_fc: 21
    tc_name: "CF_PURGE_QUEUE_CC"
    notes: "Params: CHAN(uint8), QUEUE(uint8, 0=pending/1=history/2=both) + 2 spare bytes."
    fuzz: true
  - tc_fc: 22
    tc_name: "CF_ENABLE_ENGINE_CC"
    notes: "No params (CF_NoArgsCmd_t)."
    fuzz: true
  - tc_fc: 23
    tc_name: "CF_DISABLE_ENGINE_CC"
    notes: "No params (CF_NoArgsCmd_t)."
    fuzz: true
