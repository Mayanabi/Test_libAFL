[package]
name = "maya_libafl_poc"
version = "0.1.0"
edition = "2021"

[dependencies]
libafl = "0.15.3"
libafl_bolts = "0.15.3"
serde = { version = "1", features = ["derive"] }
serde_json  = "1"
serde_yaml  = "0.9"
toml        = "0.8"
ctrlc       = "3"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = 3
debug = true